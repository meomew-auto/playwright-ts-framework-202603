name: Playwright Tests

# ══════════════════════════════════════════════════════════════════════════════
# TRIGGERS
# ══════════════════════════════════════════════════════════════════════════════

on:
  # Push/PR → chạy neko-api mặc định (nhanh, ổn định, không cần browser)
  push:
    branches: [main, master, feature/ci]
  pull_request:
    branches: [main, master]

  # Manual dispatch → chọn suite, environment, tag linh hoạt
  workflow_dispatch:
    inputs:
      suite:
        description: 'Test suite cần chạy'
        required: true
        default: 'neko-api'
        type: choice
        options:
          - neko-api
          - neko-ui
          - cms-desktop
          - cms-mobile
      environment:
        description: 'Môi trường (NODE_ENV → dotenv-flow load .env / .env.uat)'
        required: true
        default: 'development'
        type: choice
        options:
          - development
          - uat
      tag:
        description: 'Filter theo tag (@smoke, @regression, để trống = tất cả)'
        required: false
        default: ''
        type: choice
        options:
          - ''
          - '@smoke'
          - '@regression'

# ══════════════════════════════════════════════════════════════════════════════
# JOBS
# ══════════════════════════════════════════════════════════════════════════════

jobs:
  test:
    name: 🎭 ${{ inputs.suite || 'neko-api' }} (${{ inputs.environment || 'development' }})
    runs-on: ubuntu-latest
    timeout-minutes: 30

    permissions:
      contents: read
      actions: read

    # ─────────────────────────────────────────────────────────────
    # GitHub Environment — secrets ăn theo environment
    # Repo Settings → Environments → development / uat
    # Mỗi environment có bộ secrets riêng (passwords có thể khác nhau)
    # ─────────────────────────────────────────────────────────────
    environment: ${{ inputs.environment || 'development' }}

    env:
      NODE_ENV: ${{ inputs.environment || 'development' }}
      CI: true
      LOG_LEVEL: warn

      # Secrets — tự động lấy từ GitHub Environment tương ứng
      NEKO_ADMIN_USERNAME: ${{ secrets.NEKO_ADMIN_USERNAME }}
      NEKO_ADMIN_PASSWORD: ${{ secrets.NEKO_ADMIN_PASSWORD }}
      NEKO_STAFF_USERNAME: ${{ secrets.NEKO_STAFF_USERNAME }}
      NEKO_STAFF_PASSWORD: ${{ secrets.NEKO_STAFF_PASSWORD }}

      CMS_ADMIN_EMAIL: ${{ secrets.CMS_ADMIN_EMAIL }}
      CMS_ADMIN_PASSWORD: ${{ secrets.CMS_ADMIN_PASSWORD }}

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 📦 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: 'npm'

      - name: 📥 Install dependencies
        run: npm ci

      - name: 🗄️ Cache Playwright Browsers
        id: playwright-cache
        if: inputs.suite != 'neko-api' || github.event_name != 'workflow_dispatch'
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: 🎭 Install Playwright Browsers
        if: (inputs.suite != 'neko-api' || github.event_name != 'workflow_dispatch') && steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      - name: 🎭 Install Playwright Dependencies (if cached)
        if: (inputs.suite != 'neko-api' || github.event_name != 'workflow_dispatch') && steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium

      # ─────────────────────────────────────────────────────────────
      # 📊 Reports — Chuẩn bị thư mục & nạp lịch sử trước khi chạy
      # ─────────────────────────────────────────────────────────────
      - name: 📥 Download Previous History
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "Finding previous run with history artifact..."
          mkdir -p playwright-report
          PREV_RUN=$(gh run list --workflow=playwright.yml --status=success --limit=5 --json databaseId -q '.[0].databaseId' 2>/dev/null || echo "")
          echo "Previous run ID: ${PREV_RUN:-'(none)'}"
          if [ -n "$PREV_RUN" ]; then
            gh run download "$PREV_RUN" --name smart-report-history --dir playwright-report 2>/dev/null && echo "Downloaded history from run $PREV_RUN!" || echo "No history artifact in run $PREV_RUN"
          else
            echo "No previous successful runs found with history"
          fi

      # ─────────────────────────────────────────────────────────────
      # 🧪 Run Tests — Dynamic command builder
      # ─────────────────────────────────────────────────────────────
      - name: 🧪 Run Playwright tests
        run: |
          SUITE="${{ inputs.suite || 'neko-api' }}"
          TAG="${{ inputs.tag }}"

          # Suite → Project mapping (Playwright tự chạy setup dependency)
          case "$SUITE" in
            neko-api)     PROJECTS="--project=neko-api" ;;
            neko-ui)      PROJECTS="--project=neko-ui" ;;
            cms-desktop)  PROJECTS="--project=cms-desktop" ;;
            cms-mobile)   PROJECTS="--project=cms-mobile" ;;
            *)            PROJECTS="--project=neko-api" ;;
          esac

          # Build command
          CMD="npx playwright test $PROJECTS"

          # Tag filter (Playwright dùng --grep, không phải --tag)
          if [ -n "$TAG" ]; then
            CMD="$CMD --grep \"$TAG\""
          fi

          echo "📋 Suite:       $SUITE"
          echo "🌍 Environment: $NODE_ENV"
          echo "🏷️  Tag:         ${TAG:-'(tất cả)'}"
          echo "🚀 Command:     $CMD"
          echo "────────────────────────────────────"

          eval $CMD

      # ─────────────────────────────────────────────────────────────
      # 📤 Upload Artifacts — Smart Reporter + Playwright HTML
      # ─────────────────────────────────────────────────────────────
      - name: 📤 Upload Smart Report History
        uses: actions/upload-artifact@v4
        if: always()
        continue-on-error: true
        with:
          name: smart-report-history
          path: playwright-report/test-history.json
          retention-days: 90
          overwrite: true

      - name: 📤 Upload Playwright & Smart Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30

  # ==================== DEPLOY REPORT ====================
  deploy-report:
    name: 🚀 Deploy Report to GitHub Pages
    needs: test
    if: always() && github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: 📥 Download Playwright & Smart Report
        uses: actions/download-artifact@v4
        with:
          name: playwright-report
          path: ./site

      - name: 📦 Setup Pages
        uses: actions/configure-pages@v4
        with:
          enablement: true

      - name: 🌐 Create Index Page
        run: |
          cat > ./site/index.html << 'EOF'
          <!DOCTYPE html>
          <html lang="en">
          <head>
            <meta charset="UTF-8">
            <meta name="viewport" content="width=device-width, initial-scale=1.0">
            <title>🎭 Playwright Test Reports</title>
            <style>
              body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%); min-height: 100vh; display: flex; align-items: center; justify-content: center; margin: 0; }
              .container { text-align: center; }
              h1 { color: #fff; font-size: 2.5rem; margin-bottom: 2rem; }
              .cards { display: flex; gap: 2rem; flex-wrap: wrap; justify-content: center; }
              .card { background: rgba(255,255,255,0.1); backdrop-filter: blur(10px); border-radius: 16px; padding: 2rem; width: 280px; text-decoration: none; color: #fff; transition: transform 0.3s, box-shadow 0.3s; border: 1px solid rgba(255,255,255,0.1); }
              .card:hover { transform: translateY(-8px); box-shadow: 0 20px 40px rgba(0,0,0,0.3); }
              .card h2 { margin: 0 0 0.5rem; font-size: 1.5rem; }
              .card p { opacity: 0.7; margin: 0; font-size: 0.9rem; }
              .icon { font-size: 3rem; margin-bottom: 1rem; }
            </style>
          </head>
          <body>
            <div class="container">
              <h1>🎭 Test Reports</h1>
              <div class="cards">
                <a href="smart-report.html" class="card">
                  <div class="icon">📊</div>
                  <h2>Smart Report</h2>
                  <p>Interactive dashboard with historical trends</p>
                </a>
                <a href="html/index.html" class="card">
                  <div class="icon">🎬</div>
                  <h2>Playwright HTML</h2>
                  <p>Native Playwright report with trace viewers</p>
                </a>
              </div>
            </div>
          </body>
          </html>
          EOF
          
          echo "Site structure:"
          ls -la ./site/

      - name: 📤 Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./site

      - name: 🚀 Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4